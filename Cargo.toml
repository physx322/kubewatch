[workspace]
resolver = "2"
members = ["crates/core", "crates/hub", "crates/updater", "crates/ai", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/kubewatch-io/kubewatch"
homepage = "https://github.com/kubewatch-io/kubewatch"
authors = ["KubeWatch contributors"]

[workspace.dependencies]
kubewatch-core = { path = "crates/core", version = "0.1.0" }
kubewatch-hub = { path = "crates/hub", version = "0.1.0" }
kubewatch-updater = { path = "crates/updater", version = "0.1.0" }
kubewatch-ai = { path = "crates/ai", version = "0.1.0" }

# Application de bureau : Tauri 2 (backend Rust) + interface web dans ui/.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

kube = { version = "4.2", default-features = false, features = ["client", "config", "runtime", "derive", "ws", "rustls-tls", "ring", "gzip", "socks5", "http-proxy", "oidc", "jsonpatch"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["latest"] }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "io-util", "io-std", "process", "net"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
futures = "0.3"
async-trait = "0.1"

http = "1"

reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "webpki-roots", "json", "query", "form", "multipart", "gzip", "brotli", "stream", "charset", "http2", "system-proxy"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

semver = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"
humantime-serde = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

anyhow = "1"
thiserror = "2"

base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
subtle = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7"
open = "5"
bytes = "1"
urlencoding = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
which = "8"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"

[profile.dev]
opt-level = 0
debug = 1

name: Rapport de bug
description: Signaler un comportement incorrect de KubeWatch
title: "[bug] "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème.

        **Ne collez jamais de kubeconfig, de jeton GitHub, de certificat client
        ni de secret Kubernetes** : anonymisez les sorties avant de les joindre.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Vérifications préalables
      options:
        - label: J'ai cherché dans les issues existantes (ouvertes et fermées).
          required: true
        - label: Je reproduis le problème avec la dernière version publiée.
          required: true
        - label: Ma sortie de logs ne contient aucun secret ni jeton.
          required: true

  - type: input
    id: version
    attributes:
      label: Version de KubeWatch
      description: "Version affichée dans l'écran Réglages, ou nom de l'archive téléchargée"
      placeholder: "KubeWatch 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Plateforme
      options:
        - Linux x86_64
        - Linux aarch64
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows x86_64
        - Windows aarch64
        - Image conteneur (ghcr.io)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Mode d'installation
      options:
        - Binaire téléchargé depuis les releases
        - Image Docker / conteneur Kubernetes
        - Compilé depuis les sources (cargo build)
        - Autre
    validations:
      required: true

  - type: input
    id: kubernetes
    attributes:
      label: Distribution et version de Kubernetes
      description: "Sortie de `kubectl version --short` ou équivalent"
      placeholder: "k3s v1.31.2 / EKS 1.30 / kind v0.24"
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Mode de connexion au cluster
      options:
        - kubeconfig local (chemin par défaut)
        - fichier .yml fourni à KubeWatch
        - connexion distante (serveur + jeton)
        - in-cluster (ServiceAccount)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Zone concernée
      options:
        - Connexion au cluster / contextes
        - Liste et détail des ressources
        - Application de YAML (apply / diff / delete)
        - Logs ou terminal (exec)
        - Métriques et vue d'ensemble
        - Hub d'images / déploiement
        - Détecteur d'updates GitHub
        - Topologie
        - Assistant IA (Claude, ChatGPT, modèle local)
        - Interface : affichage, thème, raccourcis
        - Build / packaging / CI
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: Description du problème
      description: Ce qui se produit, et ce que vous attendiez à la place.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      description: La séquence minimale permettant d'observer le problème.
      placeholder: |
        1. Lancer `kubewatch-desktop`
        2. Ouvrir l'onglet « Ressources »
        3. Sélectionner le namespace « default »
        4. Observer l'erreur
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Journaux
      description: "Relancez avec `RUST_LOG=debug` et collez la sortie pertinente (anonymisée)."
      render: shell
    validations:
      required: false

  - type: textarea
    id: manifest
    attributes:
      label: Manifeste ou requête déclenchant le problème
      description: Le YAML ou l'appel d'API concerné, anonymisé.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Contexte additionnel
      description: Captures d'écran, particularités réseau (proxy, mTLS), RBAC restreint…
    validations:
      required: false

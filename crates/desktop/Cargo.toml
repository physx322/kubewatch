[package]
name = "kubewatch-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "KubeWatch — application de bureau pour piloter des clusters Kubernetes, avec assistant IA"
publish = false

[[bin]]
name = "kubewatch-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
kubewatch-core.workspace = true
kubewatch-hub.workspace = true
kubewatch-updater.workspace = true
kubewatch-ai.workspace = true

tauri.workspace = true
rustls.workspace = true
rfd.workspace = true
open.workspace = true

tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
dirs.workspace = true
parking_lot.workspace = true
uuid.workspace = true

# WebKitGTK lit les réglages de rastérisation du texte dans `GtkSettings` :
# c'est le seul usage de GTK ici, et il n'a de sens que là où WebKitGTK existe.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk.workspace = true

[dev-dependencies]
tempfile.workspace = true
